[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerrank"
version = "0.1.0"
description = "A statistically powered leaderboard for small language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
eval = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=3.0",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
]
plots = ["matplotlib>=3.9"]
stats = ["statsmodels>=0.14"]
dev = ["pytest>=8.0"]

[project.scripts]
powerrank = "powerrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
